<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1114">
<title>Un secret t’attend</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='%23d6b47a'><ellipse cx='12' cy='5.6' rx='3.6' ry='5'/><ellipse cx='12' cy='5.6' rx='3.6' ry='5' transform='rotate(72 12 12)'/><ellipse cx='12' cy='5.6' rx='3.6' ry='5' transform='rotate(144 12 12)'/><ellipse cx='12' cy='5.6' rx='3.6' ry='5' transform='rotate(216 12 12)'/><ellipse cx='12' cy='5.6' rx='3.6' ry='5' transform='rotate(288 12 12)'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="dist/jardin.js">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="jardin" id="jardin"></div>

<button type="button" class="son" id="son" aria-pressed="true" aria-label="Couper le son"></button>

<!-- Téléphone tenu à l'horizontale : on invite à le tourner -->
<div class="tourner" role="alert">
  <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="32" rx="3.5"/><path d="M21.5 33h5"/><path d="M39 22a14 14 0 0 1-9 16.5M39 22l-3.2 2.4M39 22l1.6 3.6"/></svg>
  <p>Tourne ton téléphone<br>pour découvrir la surprise</p>
</div>

<!-- 0. Le jardin : une fleur pousse pour chaque mot doux (premier écran) -->
<section id="e-intro" class="ecran ecran-intro actif" aria-label="Mots doux">
  <p class="lecteur-seul" id="intro-texte"></p>
  <p class="toucher" id="intro-toucher" aria-hidden="true">Touche pour tout voir</p>
  <button type="button" class="btn suivant cache" id="intro-suivant" data-vers="e-code" aria-hidden="true" tabindex="-1"></button>
</section>

<!-- 1. Le code -->
<section id="e-code" class="ecran verrou" aria-labelledby="verrou-titre" hidden>
  <div class="cadenas" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <path class="anse" d="M42 56V40a18 18 0 0 1 36 0v16" fill="none" stroke-width="3" stroke-linecap="round"/>
      <rect class="corps" x="24" y="54" width="72" height="52" rx="16"/>
      <rect class="filet-corps" x="30" y="60" width="60" height="40" rx="11"/>
      <g class="fleur-cadenas">
        <ellipse cx="60" cy="70.5" rx="4.2" ry="8.5"/>
        <ellipse cx="60" cy="70.5" rx="4.2" ry="8.5" transform="rotate(72 60 79)"/>
        <ellipse cx="60" cy="70.5" rx="4.2" ry="8.5" transform="rotate(144 60 79)"/>
        <ellipse cx="60" cy="70.5" rx="4.2" ry="8.5" transform="rotate(216 60 79)"/>
        <ellipse cx="60" cy="70.5" rx="4.2" ry="8.5" transform="rotate(288 60 79)"/>
        <circle cx="60" cy="79" r="3.6"/>
      </g>
    </svg>
  </div>
  <h1 id="verrou-titre">Un secret t'attend</h1>
  <p class="pour" id="verrou-pour"></p>
  <p class="indice" id="indice"></p>
  <div class="points" id="points" aria-hidden="true"></div>
  <p class="message" id="message" role="status"></p>
  <p class="lecteur-seul" id="annonce-code" aria-live="polite"></p>
  <div class="clavier" id="clavier"></div>
</section>

<!-- 2. Les photos -->
<section id="e-photos" class="ecran" aria-labelledby="t-photos" hidden>
  <p class="petit" id="photos-pour"></p>
  <h2 class="script" id="t-photos" tabindex="-1"></h2>
  <div class="galerie" id="galerie" tabindex="0" aria-label="Photos, fais glisser pour voir la suite"></div>
  <div class="reperes" id="reperes" aria-hidden="true"></div>
  <button type="button" class="btn suivant" data-vers="e-lettre">Continuer</button>
</section>

<!-- 3. La lettre -->
<section id="e-lettre" class="ecran" aria-labelledby="t-lettre" hidden>
  <h2 class="script" id="t-lettre" tabindex="-1">Une lettre pour toi</h2>
  <button type="button" class="enveloppe" id="enveloppe" aria-expanded="false" aria-controls="lettre" aria-label="Ouvrir la lettre">
    <span class="env-fond" aria-hidden="true"></span>
    <span class="env-carte" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="env-poche" aria-hidden="true"></span>
    <span class="rabat" aria-hidden="true"></span>
    <span class="sceau" aria-hidden="true"><i class="ico-fleur"></i></span>
  </button>
  <p class="ouvrir" id="ouvrir-lettre" aria-hidden="true">Touche l'enveloppe pour l'ouvrir</p>
  <article class="lettre" id="lettre" hidden>
    <p class="lettre-pour" id="lettre-pour"></p>
    <div id="lettre-texte"></div>
    <p class="signature script" id="signature"></p>
    <p class="de" id="de"></p>
  </article>
  <button type="button" class="btn suivant" id="apres-lettre" data-vers="e-cadeau" hidden>Continuer</button>
</section>

<!-- 4. Le cadeau, puis la demande -->
<section id="e-cadeau" class="ecran ecran-cadeau" aria-labelledby="t-cadeau" hidden>
  <div class="scene3d" id="scene3d" aria-hidden="true"></div>
  <div id="avant">
    <h2 class="script" id="t-cadeau" tabindex="-1"></h2>
    <p class="consigne" id="consigne" aria-live="polite">Appuie sur le cadeau</p>
    <button type="button" class="boite" id="boite" aria-label="Ouvrir le cadeau">
      <svg viewBox="0 0 220 230" aria-hidden="true">
        <defs>
          <linearGradient id="g-boite" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8a2b3d"/><stop offset="1" stop-color="#4a1422"/>
          </linearGradient>
          <linearGradient id="g-ruban" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f3e0b6"/><stop offset=".5" stop-color="#d6b47a"/><stop offset="1" stop-color="#a88350"/>
          </linearGradient>
        </defs>
        <ellipse cx="110" cy="222" rx="80" ry="7" fill="#000" opacity=".25"/>
        <rect x="30" y="105" width="160" height="115" rx="8" fill="url(#g-boite)"/>
        <rect x="30" y="105" width="160" height="16" fill="#000" opacity=".12"/>
        <rect x="99" y="105" width="22" height="115" fill="url(#g-ruban)"/>
        <g id="couvercle">
          <rect x="20" y="78" width="180" height="34" rx="7" fill="url(#g-boite)"/>
          <rect x="99" y="78" width="22" height="34" fill="url(#g-ruban)"/>
          <path d="M110 78c-14-30-56-34-52-10 3 16 34 14 52 10z" fill="url(#g-ruban)"/>
          <path d="M110 78c14-30 56-34 52-10-3 16-34 14-52 10z" fill="url(#g-ruban)"/>
          <path d="M110 78c-8 8-16 24-24 34M110 78c8 8 16 24 24 34" stroke="#a88350" stroke-width="7" fill="none" stroke-linecap="round"/>
          <circle cx="110" cy="76" r="9" fill="#d6b47a"/>
        </g>
      </svg>
    </button>
    <div class="jauge" id="jauge" aria-hidden="true"></div>
  </div>

  <div id="demande" class="demande" hidden>
    <div class="rayons" aria-hidden="true"></div>
    <div class="bague" aria-hidden="true">
      <svg viewBox="0 0 200 220">
        <defs>
          <linearGradient id="g-or" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff4c9"/><stop offset=".45" stop-color="#e8bd52"/><stop offset="1" stop-color="#a06c14"/>
          </linearGradient>
          <linearGradient id="g-diamant" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f4f1ec"/><stop offset="1" stop-color="#d9d4cc"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="142" r="56" fill="none" stroke="url(#g-or)" stroke-width="13"/>
        <circle cx="100" cy="142" r="56" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="40 312" stroke-dashoffset="-200"/>
        <path d="M84 86l-4-16M116 86l4-16M100 88V70" stroke="url(#g-or)" stroke-width="5" stroke-linecap="round"/>
        <polygon points="70,56 84,38 116,38 130,56" fill="url(#g-diamant)" stroke="#e6e1d9" stroke-width="1.5"/>
        <polygon points="70,56 130,56 100,86" fill="url(#g-diamant)" stroke="#e6e1d9" stroke-width="1.5"/>
        <path d="M84 38l6 18 10-18 10 18 6-18M70 56l30 30 30-30M90 56l10 30 10-30" fill="none" stroke="#d9d2c6" stroke-width="1.2"/>
        <g class="eclats-bague" fill="#fff">
          <path d="M146 30l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
          <path d="M54 22l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
          <path d="M160 72l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
        </g>
      </svg>
    </div>
    <p class="petit" id="demande-pour"></p>
    <h2 class="script question" id="question" tabindex="-1"></h2>
    <div class="reponses" id="reponses"></div>
    <div class="apres-oui" id="apres-oui" hidden>
      <div class="moment-oui" id="moment-oui">
        <p class="script grand">Tu as dit oui</p>
        <p id="apres-oui-texte"></p>
      </div>
      <figure class="verset" id="verset" hidden>
        <p class="verset-ar" id="verset-ar" lang="ar" dir="rtl"></p>
        <p class="verset-fr" id="verset-fr"></p>
        <figcaption class="verset-ref" id="verset-ref"></figcaption>
      </figure>
      <p class="signature-fin" id="signature-fin" hidden><span class="noms" id="fin-noms"></span><span class="filet" aria-hidden="true"></span><span class="date" id="fin-date"></span></p>
      <a class="btn" id="whatsapp" target="_blank" rel="noopener" hidden>Envoyer ma réponse sur WhatsApp</a>
    </div>
  </div>
</section>

<script src="contenu.js"></script>
<script src="sons.js"></script>
<script src="app.js"></script>
</body>
</html>
